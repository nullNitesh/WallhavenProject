<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallhaven Downloader — Browse & Download Wallpapers</title>
  <meta name="description" content="Browse Wallhaven wallpapers and download them directly to your local Wallpaper folder in one click." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header id="app-header">
    <div class="header-inner">
      <div class="logo" id="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>Wallhaven <em>Downloader</em></span>
      </div>
      <div class="search-wrapper" id="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          id="search-input"
          placeholder="Search wallpapers… (e.g. nature, anime, cyberpunk)"
          autocomplete="off"
        />
        <kbd class="search-shortcut" id="search-shortcut">/</kbd>
      </div>
    </div>
  </header>

  <!-- ===== FILTERS BAR ===== -->
  <section id="filters-bar">
    <div class="filters-inner">
      <!-- Categories -->
      <div class="filter-group" id="filter-categories">
        <span class="filter-label">Category</span>
        <div class="filter-chips">
          <button class="chip active" data-category="general" id="chip-general">General</button>
          <button class="chip active" data-category="anime" id="chip-anime">Anime</button>
          <button class="chip" data-category="people" id="chip-people">People</button>
        </div>
      </div>

      <!-- Purity -->
      <div class="filter-group" id="filter-purity">
        <span class="filter-label">Purity</span>
        <div class="filter-chips">
          <button class="chip purity-sfw active" data-purity="sfw" id="chip-sfw">SFW</button>
          <button class="chip purity-sketchy" data-purity="sketchy" id="chip-sketchy">Sketchy</button>
        </div>
      </div>

      <!-- Sorting -->
      <div class="filter-group" id="filter-sorting">
        <span class="filter-label">Sort</span>
        <select id="sorting-select">
          <option value="date_added">Latest</option>
          <option value="relevance">Relevance</option>
          <option value="random">Random</option>
          <option value="views">Views</option>
          <option value="favorites">Favorites</option>
          <option value="toplist">Toplist</option>
          <option value="hot">Hot</option>
        </select>
      </div>

      <!-- Top Range (only visible when sorting=toplist) -->
      <div class="filter-group hidden" id="filter-toprange">
        <span class="filter-label">Range</span>
        <select id="toprange-select">
          <option value="1d">1 Day</option>
          <option value="3d">3 Days</option>
          <option value="1w">1 Week</option>
          <option value="1M" selected>1 Month</option>
          <option value="3M">3 Months</option>
          <option value="6M">6 Months</option>
          <option value="1y">1 Year</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content">
    <!-- Results info -->
    <div class="results-info" id="results-info">
      <span id="results-count"></span>
    </div>

    <!-- Wallpaper Grid -->
    <div class="wallpaper-grid" id="wallpaper-grid">
      <!-- Cards injected via JS -->
    </div>

    <!-- Loading skeleton -->
    <div class="wallpaper-grid skeleton-grid" id="skeleton-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <!-- Empty state -->
    <div class="empty-state hidden" id="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <h2>No wallpapers found</h2>
      <p>Try adjusting your search or filters</p>
    </div>

    <!-- Pagination -->
    <nav class="pagination" id="pagination">
      <!-- Injected via JS -->
    </nav>
  </main>

  <!-- ===== WALLPAPER DETAIL MODAL ===== -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close modal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="modal-body" id="modal-body">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- App Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
